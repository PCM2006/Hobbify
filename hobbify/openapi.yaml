openapi: 3.0.3
info:
  title: Hobbify
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/auth/csrf:
    get:
      operationId: obtenerCsrf
      summary: Obtener el token CSRF de la sesión
      description: Conserva la cookie y solicita un token nuevo después de iniciar o cerrar sesión.
      responses:
        '200':
          description: Cabecera y token que se envían en las solicitudes POST y PUT.
          content:
            application/json:
              schema:
                type: object
                required: [headerName, token]
                properties:
                  headerName:
                    type: string
                    example: X-CSRF-TOKEN
                  token:
                    type: string
  /api/v1/auth/registro:
    post:
      operationId: registrarCuenta
      summary: Registrar una cuenta personal o empresarial
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registro'
      responses:
        '201':
          $ref: '#/components/responses/Cuenta'
        '400':
          description: Datos inválidos.
        '403':
          $ref: '#/components/responses/CsrfInvalido'
        '409':
          description: El correo ya está registrado.
  /api/v1/auth/login:
    post:
      operationId: iniciarSesion
      summary: Iniciar sesión con correo y contraseña
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Cuenta autenticada. Conserva la cookie JSESSIONID y solicita otro token CSRF.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cuenta'
        '400':
          description: Datos inválidos.
        '401':
          description: Credenciales inválidas o cuenta no disponible.
        '403':
          $ref: '#/components/responses/CsrfInvalido'
  /api/v1/auth/me:
    get:
      operationId: consultarCuenta
      summary: Consultar la cuenta de la sesión actual
      security:
        - Sesion: []
      responses:
        '200':
          $ref: '#/components/responses/Cuenta'
        '401':
          description: Sesión ausente, vencida o cuenta no disponible.
  /api/v1/auth/logout:
    post:
      operationId: cerrarSesion
      summary: Cerrar la sesión actual
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          description: Sesión cerrada.
        '403':
          $ref: '#/components/responses/CsrfInvalido'
  /api/v1/empresas/me:
    get:
      operationId: consultarPerfilPropio
      summary: Consultar el perfil de la empresa de la sesión
      security:
        - Sesion: []
      responses:
        '200':
          $ref: '#/components/responses/PerfilEmpresa'
        '401':
          description: Sesión ausente, vencida o cuenta no disponible.
        '403':
          description: La sesión pertenece a una cuenta personal.
    put:
      operationId: actualizarPerfilPropio
      summary: Actualizar los datos públicos de la empresa de la sesión
      description: Los campos opcionales omitidos, nulos o vacíos se limpian.
      security:
        - Sesion: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosPerfilEmpresa'
      responses:
        '200':
          $ref: '#/components/responses/PerfilEmpresa'
        '400':
          description: Datos del perfil inválidos.
        '401':
          description: Sesión ausente, vencida o cuenta no disponible.
        '403':
          description: Sesión de cuenta personal o token CSRF ausente o inválido.
  /api/v1/empresas/me/presentacion:
    put:
      operationId: actualizarPresentacionPropia
      summary: Guardar el nombre, la descripción y el color de portada
      description: Actualiza únicamente los campos de presentación del perfil empresarial.
      security:
        - Sesion: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentacionEmpresa'
      responses:
        '200':
          $ref: '#/components/responses/PerfilEmpresa'
        '400':
          description: La presentación está incompleta o tiene un color inválido.
        '401':
          description: Sesión ausente, vencida o cuenta no disponible.
        '403':
          description: Sesión de cuenta personal o token CSRF ausente o inválido.
  /api/v1/empresas/{id}:
    get:
      operationId: consultarPerfilPublico
      summary: Consultar el perfil público y las publicaciones visibles de una empresa
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Perfil público y publicaciones ordenadas de la más reciente a la más antigua.
          content:
            application/json:
              schema:
                type: object
                required: [perfil, publicaciones]
                properties:
                  perfil:
                    $ref: '#/components/schemas/PerfilEmpresa'
                  publicaciones:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicacionResumenEmpresa'
        '404':
          description: Empresa no encontrada o fuera del catálogo público.
components:
  securitySchemes:
    Sesion:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    Csrf:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Token obtenido en GET /api/v1/auth/csrf para la misma sesión.
      schema:
        type: string
  responses:
    Cuenta:
      description: Datos de la cuenta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Cuenta'
    PerfilEmpresa:
      description: Datos editables del perfil público de la empresa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PerfilEmpresa'
    CsrfInvalido:
      description: Token CSRF ausente o inválido.
  schemas:
    TipoCuenta:
      type: string
      enum: [USUARIO, EMPRESA]
    Login:
      type: object
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
          maxLength: 254
        contrasena:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          description: Máximo de 72 bytes en UTF-8.
    Registro:
      type: object
      required: [nombre, correo, contrasena, tipo]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        apellido:
          type: string
          maxLength: 120
          nullable: true
        correo:
          type: string
          format: email
          maxLength: 254
        contrasena:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Máximo de 72 bytes en UTF-8.
        tipo:
          $ref: '#/components/schemas/TipoCuenta'
        nombreComercial:
          type: string
          maxLength: 140
          nullable: true
          description: Obligatorio para las cuentas EMPRESA.
    Cuenta:
      type: object
      required: [id, nombre, apellido, correo, tipo, nombreComercial]
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        apellido:
          type: string
          nullable: true
        correo:
          type: string
          format: email
        tipo:
          $ref: '#/components/schemas/TipoCuenta'
        nombreComercial:
          type: string
          nullable: true
    DatosPerfilEmpresa:
      type: object
      required: [nombreComercial]
      properties:
        nombreComercial:
          type: string
          minLength: 1
          maxLength: 140
        descripcion:
          type: string
          nullable: true
        correoPublico:
          type: string
          format: email
          maxLength: 254
          nullable: true
        telefonoPublico:
          type: string
          maxLength: 30
          nullable: true
        sitioWeb:
          type: string
          format: uri
          maxLength: 250
          nullable: true
          description: URL HTTP o HTTPS.
        instagramUrl:
          type: string
          format: uri
          nullable: true
          description: URL HTTP o HTTPS.
        facebookUrl:
          type: string
          format: uri
          nullable: true
          description: URL HTTP o HTTPS.
        whatsapp:
          type: string
          maxLength: 30
          nullable: true
    PresentacionEmpresa:
      type: object
      required: [nombreComercial, descripcion, colorPrincipal]
      properties:
        nombreComercial:
          type: string
          minLength: 1
          maxLength: 140
        descripcion:
          type: string
          minLength: 1
        colorPrincipal:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#522bb8'
    PerfilEmpresa:
      allOf:
        - $ref: '#/components/schemas/DatosPerfilEmpresa'
        - type: object
          required: [id, colorPrincipal]
          properties:
            id:
              type: integer
              format: int64
            colorPrincipal:
              type: string
              pattern: '^#[0-9A-Fa-f]{6}$'
              default: '#522bb8'
    PublicacionResumenEmpresa:
      type: object
      required: [id, tipo, titulo, publicadaEn]
      properties:
        id:
          type: integer
          format: int64
        tipo:
          type: string
          enum: [lugar, taller, charla]
        titulo:
          type: string
        publicadaEn:
          type: string
          format: date-time
