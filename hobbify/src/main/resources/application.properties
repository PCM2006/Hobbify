spring.application.name=hobbify
spring.config.import=optional:file:./.env[extension=.properties][encoding=utf-8]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hobbify}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.flyway.default-schema=public
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
hobbify.frontend.origenes=${HOBBIFY_FRONTEND_ORIGINS:http://localhost:5173}
